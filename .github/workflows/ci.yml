name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser-side tests
        run: node --test "tests/*.mjs"

  browser:
    # Real Chrome against offline fixture pages. Windows matches the supported
    # desktop setup, including its encrypted login-state store. The ordinary suite
    # runs in the job above; these shards run only the real-Chrome test files.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real-Chrome tests (shard ${{ matrix.shard }} of 3)
        shell: bash
        env:
          JOB_AGENT_BROWSER_TESTS: "1"
        run: python -m pytest -q $(python tools/scripts/browser_test_files.py ${{ matrix.shard }} 3)
