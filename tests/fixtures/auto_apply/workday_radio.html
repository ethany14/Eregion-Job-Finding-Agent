<!doctype html>
<!-- Workday radio group (Adobe pilot 2026-10-16), reduced: an overlay covers the inputs
     so check() cannot click them; the labels stay clickable. -->
<html><body>
<fieldset><legend><label id="radio-label1">Have you been employed by Adobe in the past?*</label></legend>
  <div name="candidateIsPreviousWorker" aria-labelledby="radio-label1" aria-required="true">
    <div style="position:relative;display:inline-block"><input id="hd0i6" name="candidateIsPreviousWorker" type="radio" value="true">
      <div style="position:absolute;inset:-4px;background:rgba(255,255,255,.01)"></div></div><label for="hd0i6">Yes</label>
    <div style="position:relative;display:inline-block"><input id="hd0i7" name="candidateIsPreviousWorker" type="radio" value="false">
      <div style="position:absolute;inset:-4px;background:rgba(255,255,255,.01)"></div></div><label for="hd0i7">No</label>
  </div></fieldset>
</body></html>
